meeting_minutes_summarizer_task:
  description: >
    Summarize the meeting transcript into a summary with the following transcript:
    {transcript}

    Write the summary to a file called "summary.txt" in the "meeting_minutes" directory.  This is provided by the tool.

    Write the action items to a file called "action_items.txt" in the "meeting_minutes" directory.  This is provided by the tool.

    I would like you to return the action items from the meeting transcript in the following format:
    - Action item 1
    - Action item 2
    - ...

    I would also like you to analyze the sentiment of the meeting transcript and write it to a file called "sentiment.txt" in the "meeting_minutes" directory.  This is provided by the tool.

  expected_output: >
    A summary of the meeting transcript and a list of action items.
  agent: meeting_minutes_summarizer

meeting_minutes_writer_task:
  description: >
    Write the meeting minutes based on the summary, action items and sentiment from the current transcript processing.  
    Put them into a nice markdown document.

    IMPORTANT: Extract ALL information from the current transcript only. Do NOT use any information from existing files or previous runs.

    - ALWAYS use today's current date for the meeting date (do not try to extract from transcript)
    - Extract the company name from the transcript or use "Company Meeting" if not found
    - Extract the organizer name from the transcript or use "Meeting Organizer" if not found
    - Create a list of attendees from the transcript (make up some if needed)
    - Extract the meeting location from the transcript or use "Virtual Meeting" if not found
    
    Do not reference any specific company names like "FinTech Plus" unless they are explicitly mentioned in the current transcript.
  expected_output: >
    A meeting minutes document based on the current transcript only with today's date
  agent: meeting_minutes_writer